<!doctype html>
<html lang="ja" data-view="list">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ネタメモ">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>ネタメモ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="vList">
  <header class="lh">
    <div class="lbar"><span class="spacer"></span>
      <button class="tbtn" id="btnListMenu" aria-label="メニュー"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><circle cx="7.5" cy="12" r=".6" fill="currentColor"/><circle cx="12" cy="12" r=".6" fill="currentColor"/><circle cx="16.5" cy="12" r=".6" fill="currentColor"/></svg></button>
    </div>
    <h1>ネタメモ</h1>
    <input id="q" type="search" placeholder="検索" autocomplete="off" enterkeyhint="search">
  </header>
  <div id="notes"></div>
  <footer class="tb">
    <span></span><span id="count"></span>
    <button class="tbtn" id="btnNew" aria-label="新規メモ"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><path d="M17.5 3.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
  </footer>
</section>

<section id="vNote" hidden>
  <header class="nh">
    <div class="nbar">
      <button class="tbtn back" id="btnBack"><svg width="13" height="22" viewBox="0 0 13 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2 2 11l9 9"/></svg>メモ</button>
      <span class="spacer"></span>
      <div class="seg" id="seg"><button data-m="memo">メモ</button><button data-m="script">台本</button></div>
      <button class="tbtn" id="btnPhoto" aria-label="写真を追加"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m21 15-4.5-4.5L8 19"/></svg></button>
      <button class="tbtn" id="btnShare" aria-label="共有"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M8 10H6a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-2"/></svg></button>
      <button class="tbtn" id="btnNoteMenu" aria-label="メニュー"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><circle cx="7.5" cy="12" r=".6" fill="currentColor"/><circle cx="12" cy="12" r=".6" fill="currentColor"/><circle cx="16.5" cy="12" r=".6" fill="currentColor"/></svg></button>
    </div>
    <div id="speakers" hidden></div>
  </header>
  <div id="ndate"></div>
  <div id="memo" class="ta rich" contenteditable="true" role="textbox" aria-multiline="true" data-ph="メモを入力" autocapitalize="off"></div>
  <div id="scriptWrap" hidden>
    <textarea id="shead" class="ta" rows="1" placeholder="タイトル・メモ" autocomplete="off"></textarea>
    <main id="script" class="script"></main>
    <button class="add" id="btnAdd">＋ 行を追加</button>
  </div>
  <div id="imgs" class="imgs" hidden></div>
  <div class="foot"></div>
</section>

<dialog id="dlg"><div class="dh"><span id="dlgTitle"></span><button class="tbtn" data-close aria-label="閉じる">✕</button></div><div class="list" id="dlgList"></div></dialog>
<input type="file" id="file" accept=".txt,.md,.json,text/plain,text/markdown,application/json" multiple hidden>
<div id="fbar" class="fbar">
  <button data-f="panel" aria-label="書式" class="aa">Aa</button>
  <button data-f="check" aria-label="チェックリスト"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="7" r="2.5" fill="currentColor" stroke="none"/><path d="m4.3 7 .9.9 1.6-1.7" stroke="var(--bar-bg)" stroke-width="1.3"/><circle cx="5.5" cy="17" r="2.3"/><path d="M11 7h9M11 17h9"/></svg></button>
  <button data-f="table" aria-label="表"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M3 9.5h18M3 14.5h18M12 9.5v10"/></svg></button>
  <button data-f="undo" aria-label="取り消す"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button data-f="redo" aria-label="やり直す"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <button data-f="done" aria-label="キーボードを閉じる"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="19" height="11" rx="2"/><path d="M6 7h.01M9 7h.01M12 7h.01M15 7h.01M18 7h.01M7 11h10M9 18l3 2.5 3-2.5"/></svg></button>
</div>
<div id="fpanel" class="fpanel" hidden></div>
<input type="file" id="photo" accept="image/*" multiple hidden>
<div id="viewer" hidden><img alt=""><div class="vbar"><button data-v="close">閉じる</button><span class="spacer"></span><button data-v="share" aria-label="共有">共有</button><button data-v="del" class="del">削除</button></div></div>
<div id="toast"></div>
<div class="banner" id="install" hidden><p>共有ボタン <b>⬆︎</b> →「<b>ホーム画面に追加</b>」でアプリとして使えます</p><button data-x aria-label="閉じる">✕</button></div>
<div class="banner" id="update" hidden><p>新しいバージョンがあります</p><button class="go" data-reload>更新</button><button data-x aria-label="閉じる">✕</button></div>

<script src="app.js"></script>
</body>
</html>
